<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#E8C84A"/>
      <stop offset="100%" stop-color="#B8942F"/>
    </linearGradient>
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008A45"/>
      <stop offset="100%" stop-color="#006A35"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A2B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>

  <!-- Shadow layer -->
  <circle cx="258" cy="258" r="240" fill="rgba(0,0,0,0.2)" filter="url(#shadowBlur)"/>

  <!-- Outer gold ring -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldRing)" stroke-width="16"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="rgba(212,175,55,0.1)" stroke-width="1"/>

  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Red chevron at top -->
  <path d="M60 120 Q256 60 452 120 L452 90 Q256 40 60 90 Z" fill="#CE1126" opacity="0.85"/>

  <!-- Black chevron at bottom -->
  <path d="M60 392 Q256 452 452 392 L452 422 Q256 472 60 422 Z" fill="#000000" opacity="0.85"/>

  <!-- White horizontal band for stars background -->
  <rect x="60" y="195" width="392" height="122" fill="#FFFFFF" opacity="0.08" rx="61"/>

  <!-- Two green stars -->
  <g transform="translate(256,256)">
    <!-- Right star with glow -->
    <circle cx="64" cy="0" r="52" fill="rgba(0,138,69,0.08)"/>
    <circle cx="64" cy="0" r="42" fill="#007A3D"/>
    <circle cx="64" cy="0" r="42" fill="none" stroke="url(#goldRing)" stroke-width="2.5"/>
    <polygon points="64,-30 70,-10 90,-10 74,4 80,24 64,14 48,24 54,4 38,-10 58,-10" fill="#FFFFFF" transform="translate(0,0)"/>

    <!-- Left star with glow -->
    <circle cx="-64" cy="0" r="52" fill="rgba(0,138,69,0.08)"/>
    <circle cx="-64" cy="0" r="42" fill="#007A3D"/>
    <circle cx="-64" cy="0" r="42" fill="none" stroke="url(#goldRing)" stroke-width="2.5"/>
    <polygon points="-64,-30 -58,-10 -38,-10 -54,4 -48,24 -64,14 -80,24 -74,4 -90,-10 -70,-10" fill="#FFFFFF" transform="translate(0,0)"/>
  </g>

  <filter id="shadowBlur">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
    <feOffset dx="2" dy="4"/>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</svg>